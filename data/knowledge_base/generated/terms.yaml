- id: terms-conteudo-gerado-pelo-usuario-e-uso-aceitavel-1
  category: legal
  title: Conteúdo Gerado pelo Usuário e Uso Aceitável (parte 1)
  content: 'Se a Plataforma permitir que os usuários postem, compartilhem ou façam upload de conteúdo
    — como comprovantes, observações de entrega ou mensagens de suporte — você concorda em não postar
    conteúdo que: - Seja ilegal ou viole direitos de propriedade intelectual de terceiros - Seja abusivo,
    ameaçador, assediador, difamatório ou discurso de ódio - Contenha discriminação ou incitação à violência
    ou a atividades ilegais - Seja spam, phishing ou contenha malware - Viole os direitos de privacidade
    ou dados pessoais de terceiros - Seja enganoso, falso ou fraudulento - Contenha violência explícita
    ou conteúdo sexual impróprio A Provedora de Serviços reserva-se o direito de: - Remover ou desativar
    o acesso a conteúdo que viole estas diretrizes - Suspender ou encerrar contas de usuários que violarem
    repetidamente estas diretrizes'
