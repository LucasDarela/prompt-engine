- id: terms-rescisao-1
  category: cancellation
  title: Rescisão (parte 1)
  content: A Provedora de Serviços pode suspender seu acesso ao sistema Chopp Hub, ao aplicativo Chopp
    Hub Driver ou aos serviços se você violar materialmente estes Termos. A Provedora de Serviços fornecerá
    a você um aviso por escrito da violação e, nos casos em que a violação puder ser sanada, você terá
    14 dias a partir do recebimento do aviso para remediar a violação. Se você não conseguir sanar a violação
    dentro desse período, a Provedora de Serviços poderá encerrar seu acesso. A Provedora de Serviços
    pode suspender ou encerrar seu acesso imediatamente, sem aviso prévio, se você violar a lei aplicável,
    infringir direitos de propriedade intelectual ou envolver-se em atividades que possam causar danos
    a outros usuários ou à Provedora de Serviços.
