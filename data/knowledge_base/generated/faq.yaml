- id: faq-planilha
  category: other
  title: Qual a diferença entre usar o Chopp Hub e uma planilha?
  content: Planilhas dependem de controle manual e são fáceis de errar. O Chopp Hub automatiza processos
    como estoque, entregas, financeiro e cobranças, reduzindo erros e evitando prejuízos que muitas vezes
    passam despercebidos.
  tags:
  - faq
  updated_at: '2026-10-14'
  source: chopp-hub@1674717:app/marketing/sections/FAQ.tsx
  reviewed: true
- id: faq-nota-fiscal
  category: other
  title: Sou obrigado a emitir nota fiscal em todas as vendas?
  content: Não. Você tem total liberdade. Pode emitir nota fiscal apenas quando quiser, sem travar sua
    operação. O sistema funciona normalmente mesmo sem emissão de NF-e.
