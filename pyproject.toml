[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prompt-engine"
version = "0.1.0"
description = "Middleware de prompts modular, testável e reutilizável para triagem de suporte com LLMs."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Lucas Darela", email = "lucasdarela@live.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "python-ulid>=3.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
all = ["prompt-engine[gemini,anthropic,openai]"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "syrupy>=4.7",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_engine"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]  # pseudocódigo ilustrativo nas specs

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.isort]
known-first-party = ["prompt_engine", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603", "S607"]  # assert e "senhas" fake são esperados em testes
# Homóglifos/fullwidth são o próprio objeto de teste e da tabela de detecção.
"tests/unit/guardrails/**" = ["S101", "RUF001", "RUF003"]
"src/prompt_engine/guardrails/injection/heuristics.py" = ["RUF001"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["prompt_engine"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.*", "anthropic.*", "openai.*"]
ignore_missing_imports = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live' --strict-markers --import-mode=importlib --cov=prompt_engine --cov-report=term-missing --cov-fail-under=80"
markers = ["live: chama provedores reais de LLM (gasta quota; rode com -m live)"]

[tool.coverage.run]
branch = true
source = ["prompt_engine"]
